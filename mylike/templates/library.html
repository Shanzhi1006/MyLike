{% extends "base.html" %}
{% block content %}
<div class="library-page">
    <div class="tab-bar">
        <button class="tab-btn active" data-tab="works" onclick="switchTab('works')">作品</button>
        <button class="tab-btn" data-tab="materials" onclick="switchTab('materials')">素材</button>
        <button class="tab-btn" data-tab="uploads" onclick="switchTab('uploads')">个人上传</button>
    </div>


    <div class="filter-bar">
        <button id="sort-order-btn" class="sort-order-btn" onclick="toggleSortOrder()">
            <span id="sort-order-icon" class="sort-order-icon"><i class="fas fa-arrow-down-wide-short"></i></span>
            <span id="sort-order-label">倒序</span>
        </button>
        <div id="filter-dimensions" class="filter-dimensions"></div>
        <div class="page-size-control filter-dropdown" id="page-size-dropdown">
            <button class="filter-dropdown-btn" onclick="togglePageSizeDropdown(event)">
                <span class="dd-label" id="page-size-label">每页 20条</span>
                <span class="dd-arrow">&#9662;</span>
            </button>
            <div class="filter-dropdown-menu" id="page-size-menu" style="display:none;"></div>
        </div>
    </div>


    <div id="filter-chips-bar" class="filter-chips-bar" style="display:none;"></div>


    <div id="works-view" class="works-view">
        <div class="loading">加载中...</div>
    </div>
    <div id="works-pagination" class="pagination-bar"></div>


    <div id="materials-view" class="materials-view" style="display:none;">
        <div class="loading">加载中...</div>
    </div>
    <div id="materials-pagination" class="pagination-bar" style="display:none;"></div>

    <div id="uploads-view" class="uploads-view" style="display:none;">
        <div class="upload-area">
            <div class="upload-dropzone" id="upload-dropzone">
                <i class="fas fa-cloud-upload-alt upload-dropzone-icon"></i>
                <p class="upload-dropzone-text">拖放文件或文件夹到此处，或</p>
                <div class="upload-buttons">
                    <button class="btn btn-primary btn-sm" onclick="document.getElementById('file-input').click()"><i class="fas fa-image"></i> 添加图片</button>
                    <button class="btn btn-secondary btn-sm" onclick="document.getElementById('folder-input').click()"><i class="fas fa-folder-open"></i> 添加文件夹</button>
                </div>
                <input type="file" id="file-input" multiple accept="image/*,video/*" style="display:none;" onchange="handleFileSelect(event)">
                <input type="file" id="folder-input" webkitdirectory multiple style="display:none;" onchange="handleFileSelect(event)">
                <div class="upload-progress" id="upload-progress" style="display:none;">
                    <div class="upload-progress-bar" id="upload-progress-bar"></div>
                    <span class="upload-progress-text" id="upload-progress-text">0%</span>
                </div>
            </div>
        </div>
        <div id="uploads-grid" class="uploads-grid">
            <div class="empty">暂无上传素材</div>
        </div>
    </div>
</div>


<button id="back-to-top" class="back-to-top-btn" onclick="scrollToTop()">
    <i class="fas fa-arrow-up"></i>
</button>


<div id="drag-delete-zone" class="drag-delete-zone" style="display:none;">
    <i class="fas fa-trash-alt"></i>
    <span>拖到此处删除</span>
</div>


<div id="tag-picker-modal" class="modal" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>选择标签</h3>
            <button class="modal-close" onclick="closeTagPicker()">&times;</button>
        </div>
        <div id="tag-picker-body" class="modal-body"></div>
        <div class="modal-footer">
            <button class="btn btn-sm btn-primary tag-picker-new-dim-btn" onclick="showPickerCreateDimension()"><i
                    class="fas fa-plus"></i> 新增维度</button>
            <div class="modal-footer-right">
                <button class="btn btn-primary btn-sm" onclick="confirmTagPicker()">确认</button>
                <button class="btn btn-secondary btn-sm" onclick="closeTagPicker()">取消</button>
            </div>
        </div>
    </div>
</div>


<div id="confirm-modal" class="modal" style="display:none;">
    <div class="modal-content modal-sm">
        <div class="modal-header">
            <h3 id="confirm-title">确认删除</h3>
            <button class="modal-close" onclick="closeConfirm()">&times;</button>
        </div>
        <div class="modal-body">
            <p id="confirm-message">确定要删除吗？此操作不可恢复。</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-danger btn-sm" id="confirm-yes" onclick="">确认删除</button>
            <button class="btn btn-secondary btn-sm" onclick="closeConfirm()">取消</button>
        </div>
    </div>
</div>


<div id="create-work-modal" class="modal" style="display:none;">
    <div class="modal-content modal-sm">
        <div class="modal-header">
            <h3>创建作品</h3>
            <button class="modal-close" onclick="closeCreateWorkModal()">&times;</button>
        </div>
        <div class="modal-body">
            <input type="text" id="create-work-title" class="text-input" placeholder="作品标题">
            <p class="create-work-info">已选择 <span id="create-work-count">0</span> 个素材，作者将标记为「个人上传」</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary btn-sm" onclick="confirmCreateWork()">创建</button>
            <button class="btn btn-secondary btn-sm" onclick="closeCreateWorkModal()">取消</button>
        </div>
    </div>
</div>


<div id="picker-create-modal" class="modal" style="display:none;">
    <div class="modal-content modal-sm">
        <div class="modal-header">
            <h3 id="picker-create-title">新建</h3>
            <button class="modal-close" onclick="closePickerCreateModal()">&times;</button>
        </div>
        <div class="modal-body">
            <input type="text" id="picker-create-input" class="text-input" placeholder="">
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary btn-sm" onclick="confirmPickerCreate()">确认</button>
            <button class="btn btn-secondary btn-sm" onclick="closePickerCreateModal()">取消</button>
        </div>
    </div>
</div>
{% endblock %}


{% block scripts %}
<script src="/static/js/image-viewer.js"></script>
<script src="/static/js/filter-bar.js"></script>
<script src="/static/js/library.js"></script>
{% endblock %}
