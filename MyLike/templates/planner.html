{% extends "base.html" %}
{% block content %}
<div class="planner-page">
    <div class="planner-toolbar">
        <input type="text" id="planner-layout-name" class="planner-table-title-input" placeholder="策划名称" value="未命名策划">
        <div class="planner-layout-controls">
            <div class="filter-dropdown" id="planner-layout-dropdown">
                <button class="filter-dropdown-btn" onclick="pToggleLayoutDropdown(event)">
                    <span class="dd-label" id="planner-layout-label">-- 新建策划 --</span>
                    <span class="dd-arrow">&#9662;</span>
                </button>
                <div class="filter-dropdown-menu" id="planner-layout-menu" style="display:none;"></div>
            </div>
            <button class="btn btn-sm btn-primary" onclick="pConfirmSave()"><i class="fas fa-save"></i> 保存</button>
            <button class="btn btn-sm btn-danger" onclick="pConfirmDeleteLayout()" id="planner-delete-btn"
                style="display:none;"><i class="fas fa-trash"></i> 删除</button>
        </div>
    </div>


    <div class="planner-body">
        <div class="planner-left">
            <div class="filter-bar">
                <button id="p-sort-order-btn" class="sort-order-btn" onclick="pToggleSortOrder()">
                    <span id="p-sort-order-icon" class="sort-order-icon"><i
                            class="fas fa-arrow-down-wide-short"></i></span>
                </button>
                <div id="p-filter-dimensions" class="filter-dimensions"></div>
                <button class="btn btn-sm btn-secondary filter-clear-btn" onclick="pClearFilters()">清除筛选</button>
            </div>
            <div id="p-filter-chips-bar" class="filter-chips-bar" style="display:none;"></div>
            <div id="planner-search-results" class="planner-search-results">
                <div class="loading">加载中...</div>
            </div>
        </div>


        <div class="planner-right">
            <div class="planner-right-toolbar">
                <div class="planner-table-menu-wrapper" id="planner-table-menu-wrapper">
                    <button class="btn btn-sm btn-secondary planner-table-menu-btn" onclick="pToggleTableMenu(event)" title="表格列表">
                        <i class="fas fa-list-ul"></i>
                    </button>
                    <div class="planner-table-menu-dropdown" id="planner-table-menu" style="display:none;"></div>
                </div>
                <span class="planner-right-toolbar-title"><i class="fas fa-table-cells-large"></i> 策划排版</span>
                <span style="font-size:12px;color:var(--text-muted);">拖拽左侧图片到格子中 · 每个表格独立设置行列数 · 右键单元格可插入/删除行和列</span>
                <button class="btn btn-sm btn-primary" onclick="pAddTable()"><i class="fas fa-table"></i> 添加表格</button>
            </div>
            <div class="planner-grid-container">
                <div id="planner-grid" class="planner-grid"></div>
            </div>
            <button class="planner-preview-btn" onclick="pOpenPreview()"><i
                    class="fas fa-expand"></i>&nbsp;&nbsp;预览</button>
        </div>
    </div>
</div>


<div id="planner-confirm-modal" class="modal" style="display:none;">
    <div class="modal-content modal-sm">
        <div class="modal-header">
            <h3 id="planner-confirm-title">确认</h3>
            <button class="modal-close" onclick="pCloseConfirm()">&times;</button>
        </div>
        <div class="modal-body">
            <p id="planner-confirm-message">确定吗？</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-danger btn-sm" id="planner-confirm-yes">确认</button>
            <button class="btn btn-secondary btn-sm" onclick="pCloseConfirm()">取消</button>
        </div>
    </div>
</div>


<div id="drag-delete-zone" class="drag-delete-zone" style="display:none;">
    <i class="fas fa-trash-alt"></i>
    <span>拖到此处删除</span>
</div>
{% endblock %}


{% block scripts %}
<script src="/static/js/image-viewer.js"></script>
<script src="/static/js/filter-bar.js"></script>
<script src="/static/js/planner.js"></script>
{% endblock %}
