{% extends "base.html" %}
{% block content %}
<div class="import-page">
    <div class="import-input-section">
        <input type="text" id="import-input" class="import-input"
            placeholder="输入分享文本，回车添加..." />
        <div class="import-block-list" id="import-block-list">
            <div class="import-block-empty" id="import-block-empty">
                <i class="fas fa-clipboard-list"></i>
                <span>输入或粘贴分享文本，回车添加，可多行粘贴</span>
            </div>
        </div>
        <div class="import-actions">
            <button id="import-btn" class="btn btn-primary" onclick="startImport()">开始导入</button>
            <button id="delete-selected-btn" class="btn btn-secondary" onclick="deleteSelectedItems()" style="display:none">删除选中</button>
            <button id="copy-selected-btn" class="btn btn-secondary" onclick="copySelectedItems()" style="display:none">复制选中</button>
            <button class="btn btn-secondary" onclick="clearAllItems()">清空全部</button>
        </div>
    </div>

    <div id="import-tasks" class="import-tasks"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/import.js"></script>
{% endblock %}
