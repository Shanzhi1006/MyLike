<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>策划预览</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f0f0;
            color: var(--text);
        }

        .preview-page {
            width: 100%;
            min-height: 100vh;
            padding: 14px;
        }

        .preview-header {
            text-align: center;
            padding: 10px 0 20px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .preview-table-section {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .preview-table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            gap: 12px;
            flex-wrap: wrap;
        }

        .preview-table-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }

        .preview-table-remark {
            padding: 6px 12px;
            font-size: 18px;
            color: var(--text-muted);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }

        .preview-table-grid {
            display: flex;
            flex-direction: column;
            gap: 0;
            padding: 10px;
        }

        .preview-row {
            display: flex;
            align-items: stretch;
            gap: 4px;
            position: relative;
            min-height: 80px;
        }

        .preview-cell {
            flex: 1;
            min-width: 0;
            border: 2px dashed var(--border);
            border-radius: 7px;
            overflow: hidden;
            position: relative;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.15s, background 0.15s;
        }

        .preview-cell.has-image {
            border-style: solid;
            border-color: var(--border);
            background: var(--surface);
        }

        .preview-cell img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .preview-cell-empty-icon {
            color: var(--border);
            font-size: 28px;
        }


        .preview-toolbar {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 1000;
            display: flex;
            gap: 8px;
        }

        .preview-toolbar .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: var(--surface);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            transition: all 0.15s;
        }

        .preview-toolbar .btn:hover {
            background: var(--bg);
            border-color: var(--primary);
        }

        .preview-toolbar .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .preview-toolbar .btn-primary:hover {
            opacity: 0.9;
        }


        .preview-export-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .preview-export-overlay.active {
            display: flex;
        }

        .preview-export-overlay .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .preview-export-overlay .overlay-text {
            color: #fff;
            font-size: 15px;
            margin-left: 14px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="preview-toolbar" id="preview-toolbar" style="display:none;">
        <button class="btn btn-primary" onclick="previewExportPNG()"><i class="fas fa-image"></i> 保存长图</button>
        <button class="btn" onclick="previewExportPDF()"><i class="fas fa-file-pdf"></i> 保存PDF</button>
    </div>
    <div class="preview-export-overlay" id="preview-export-overlay">
        <div class="spinner"></div>
        <span class="overlay-text" id="preview-export-text">正在生成...</span>
    </div>
    <div class="preview-page">
        <div class="preview-header" id="preview-header"></div>
        <div id="preview-content"></div>
    </div>
    <script src="/static/js/utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas-pro@1.5.8/dist/html2canvas-pro.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script src="/static/js/planner-preview.js"></script>
</body>

</html>
